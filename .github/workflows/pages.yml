name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch T.R Gift Shop photo
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 --connect-timeout 20 -A "Mozilla/5.0" \
            "https://stat.ameba.jp/user_images/20250911/06/maico117/1c/d4/j/o1080144015670806877.jpg?caw=800" \
            -o assets/tr-gift-shop.jpg
          test -s assets/tr-gift-shop.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
